# Decap CMS — Petani Bijak Indonesia
# Panel admin: /admin  |  Backend: GitHub (commit langsung ke repo ini)
backend:
  name: github
  repo: renaldosinaga98/petanibijakindo
  branch: main

# Alur editorial: draf -> tinjauan -> siap terbit (tersimpan sebagai PR/commit di GitHub)
publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: https://petanibijakindonesia.click
display_url: https://petanibijakindonesia.click

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "artikel"
    label: "Artikel & Panduan"
    folder: "src/content/artikel"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Deskripsi Singkat", name: "description", widget: "text" }
      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - "Budidaya Padi"
          - "Budidaya Jagung"
          - "Budidaya Sayuran"
          - "Budidaya Buah"
          - "Budidaya Palawija"
          - "Perkebunan"
          - "Pemupukan"
          - "Pengendalian Hama"
          - "Pengendalian Penyakit"
          - "Teknologi Pertanian"
          - "Manajemen Usaha Tani"
      - { label: "Penulis", name: "author", widget: "string", default: "Renaldo Sinaga" }
      - { label: "Tanggal Terbit", name: "pubDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Waktu Baca", name: "readTime", widget: "string", default: "5 menit baca", required: false }
      - { label: "Draf (sembunyikan dari situs)", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Isi Artikel", name: "body", widget: "markdown" }
